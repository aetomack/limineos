name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            nasm \
            xorriso \
            mtools \
            gdisk \
            curl \
            git

      - name: Build images
        run: make all all-hdd

      - name: Prepare release assets
        id: prep
        env:
          VERSION: ${{ github.ref_name }}
          PREFIX: ${{ github.event.repository.name }}
        run: |
          cp template.iso "${PREFIX}-${VERSION}.iso"
          cp template.hdd "${PREFIX}-${VERSION}.hdd"
          sha256sum "${PREFIX}-${VERSION}.iso" "${PREFIX}-${VERSION}.hdd" > SHA256SUMS
          echo "iso=${PREFIX}-${VERSION}.iso" >> "$GITHUB_OUTPUT"
          echo "hdd=${PREFIX}-${VERSION}.hdd" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.prep.outputs.iso }}
            ${{ steps.prep.outputs.hdd }}
            SHA256SUMS
